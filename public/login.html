<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Signup</title>
    <link rel="stylesheet" href="./stylesheets/login_signup.css" />
    <link rel="stylesheet" href="./stylesheets/navbar.css" />
    <script src="./javascripts/login_signup.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h2 id="form-title">Login</h2>

      <!-- Login form -->
      <form id="login-form" class="active">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <div class="toggle">Don’t have an account? <a id="show-signup">Sign Up</a></div>
      </form>

      <!-- Signup form -->
      <form method="POST" onsubmit="createUser()" id="signup-form">
        <input name="name" type="text" placeholder="Full Name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" required />
        <input name="confirmPassword" type="password" placeholder="Confirm Password" required />
        <button type="submit">Sign Up</button>
        <div class="toggle">Already have an account? <a id="show-login">Login</a></div>
      </form>
    </div>
  </body>
</html>
