<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopKart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="./stylesheets/navbar.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="./javascripts/navbar.js" defer></script>
    <link rel="stylesheet" href="./stylesheets/product_card.css"></link>
    <link rel="stylesheet" href="./stylesheets/home.css"></link>
    <script src="./javascripts/search.js" defer></script>
    <script src="./javascripts/home.js" defer></script>
  </head>
  <body>
  <div id="app">
    <!--NAVBAR-->
      <div class="navbar">
        <!--navbar links left-->
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="nav_left">
          <a class="nav_item" href="index.html">Home</a>
        </div>

        <!--navbar links center-->
        <div class="nav_center">
          <form class="search" id="search-form">
            <input id="search-box" onclick="showPopup()" type="search" name="" placeholder="search here..." />
          </form>
          <button
            onclick="get_data(document.getElementById('search-box').value)"
            id="search-btn"
            type="button"
            class="fa fa-search"
            aria-label="Search"></button>
        </div>

        <!--navbar links right-->
        <div class="nav_right">
          <a class="nav_item" href="###"><i class="fas fa-heart shopping-icon"></i></a>
          <a class="nav_item" href="###"><i class="fas fa-shopping-cart shopping-icon"></i></a>
          <a class="nav_item" :href="linkUrl">{{username || 'Login | Signup'}}</a>
          <a class="nav-item">
            <img v-if="linkUrl !== '/user.html'"  :src="image_path" alt="User Icon" class="user_logo">
          </a>
        </div>
      </div>
  </div>
      <!--Banner-->
      <div class="banner">
          <div class="banner_content">
            <h1>Welcome to ShopKart</h1>
            <p>Your one stop for everything</p>
          </div>
      </div>

      <!--Products-->
      <h1 class="product_header">Products</h1>
      <div class="display-container">
      </div>

      <!--footer-->
      <div class="footer">
        <div class="footer_content">
            <p>&copy; ShopKart. All rights reserved.</p>
          <p> Australia</p>
        </div>
    </div>
 
  </body>
</html>
